```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fandom — Temporarily Closed</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Inter, Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(130, 90, 255, 0.16), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(70, 120, 255, 0.12), transparent 30%),
        #08080d;
      color: #f5f5f7;
      overflow: hidden;
    }

    .background {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .orb {
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.18;
      animation: float 8s ease-in-out infinite;
    }

    .orb.one {
      background: #7c4dff;
      top: -100px;
      left: -80px;
    }

    .orb.two {
      background: #4169ff;
      bottom: -120px;
      right: -80px;
      animation-delay: -4s;
    }

    .card {
      position: relative;
      width: min(90%, 620px);
      padding: 55px 45px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 28px;
      background: rgba(16, 16, 24, 0.76);
      backdrop-filter: blur(18px);
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
      animation: appear 0.8s ease forwards;
    }

    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 22px;
      background: linear-gradient(135deg, #7654ff, #4b7cff);
      box-shadow: 0 12px 35px rgba(91, 87, 255, 0.28);
      font-size: 25px;
      font-weight: 700;
      animation: spin 7s linear infinite;
    }

    h1 {
      font-size: clamp(32px, 6vw, 48px);
      font-weight: 700;
      letter-spacing: -1.5px;
      margin-bottom: 17px;
    }

    .message {
      max-width: 470px;
      margin: 0 auto;
      color: #a9a9b5;
      font-size: 16px;
      line-height: 1.7;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 30px;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #d5d5dc;
      font-size: 13px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffb84d;
      box-shadow: 0 0 12px rgba(255, 184, 77, 0.7);
    }

    footer {
      position: fixed;
      bottom: 22px;
      left: 0;
      width: 100%;
      text-align: center;
      color: #666673;
      font-size: 12px;
      letter-spacing: 0.2px;
    }

    footer span {
      color: #8d8d9b;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(25px, -20px);
      }
    }

    @media (max-width: 600px) {
      .card {
        padding: 42px 25px;
        border-radius: 23px;
      }

      .message {
        font-size: 15px;
      }

      footer {
        bottom: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="background">
    <div class="orb one"></div>
    <div class="orb two"></div>
  </div>

  <main class="card">
    <div class="icon">:D</div>

    <h1>We'll Be Back</h1>

    <p class="message">
      This fandom is temporarily closed while we're taking some time
      to make a few changes. We'll be back soon.
    </p>

    <div class="status">
      <span class="dot"></span>
      Temporarily unavailable
    </div>
  </main>

  <footer>
    Made by <span>awakener676 on Discord</span>
  </footer>

</body>
</html>
```
